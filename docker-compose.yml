services:
  ms-classroom-management:
    build: .
    container_name: ms-classroom-management
    ports:
      - "3002:3002"
    environment:
      SERVER_PORT: 3002
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-eduaircontrol_classrooms}
      POSTGRES_USER: ${POSTGRES_USER:-classroom_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-classroom_pass}
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  postgres:
    image: postgres:15
    container_name: ms-classroom-management-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eduaircontrol_classrooms}
      POSTGRES_USER: ${POSTGRES_USER:-classroom_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-classroom_pass}
    ports:
      - "5433:5432"
    volumes:
      - classroom_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: always

volumes:
  classroom_postgres_data:
