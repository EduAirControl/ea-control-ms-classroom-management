spring.application.name=ms-classroom-management

server.port=${SERVER_PORT:3002}

spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/eduaircontrol_classrooms}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=classrooms

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# --- Mensajeria (outbox de eventos de aulas, ADR-007) ---
# El outbox se escribe en la transaccion de negocio y OutboxRelay lo publica aca.
# Sin estos valores el RabbitTemplate intenta localhost:5672 y la publicacion falla.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Exchange topic del dominio classroom. Lo declara esta aplicacion (ClassroomEventsConfig)
# y lo consume ms-environment-monitoring con el binding classroom.educational_environment.*.
app.classroom.events.exchange=${CLASSROOM_EVENTS_EXCHANGE:eduaircontrol.classroom}
app.outbox.exchange=${CLASSROOM_EVENTS_EXCHANGE:eduaircontrol.classroom}

server.error.include-message=always

springdoc.swagger-ui.path=/swagger-ui.html
